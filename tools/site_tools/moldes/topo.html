<header class="topo" id="topo">
  <div class="topo__barra wrap">
    <a class="marca" href="{R}index.html" aria-label="RPG Skills">
      <img src="{R}assets/logo.webp" alt="RPG Skills" width="82" height="40">
    </a>
    <nav class="menu" aria-label="Menu">
      <ul>
        {MENU}
      </ul>
    </nav>
    <div class="topo__acoes">
      <div class="idioma" role="group" aria-label="Idioma / Language">
        <button type="button" class="lang-option" data-lang="pt-BR">PT</button>
        <button type="button" class="lang-option" data-lang="en">EN</button>
      </div>
      <a class="btn btn--ouro btn--p topo__steam" href="{STEAM}" target="_blank" rel="noopener">
        <span lang="pt-BR">Inscrever-se</span><span lang="en">Subscribe</span>
      </a>
      <button type="button" class="menu-toggle" aria-expanded="false" aria-controls="menu-movel" aria-label="Menu">
        <span></span>
      </button>
    </div>
  </div>
  <nav class="menu-movel" id="menu-movel" aria-label="Menu" hidden>
    <ul>
        {MENU}
    </ul>
    <a class="btn btn--ouro" href="{STEAM}" target="_blank" rel="noopener">
      <span lang="pt-BR">Inscrever-se na Steam</span><span lang="en">Subscribe on Steam</span>
    </a>
  </nav>
</header>
